name: Website checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt
      - name: Build and validate every page
        run: python tools/site.py check
      - name: Content and authoring regression tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated runtime test helper
        run: npm install --prefix .cache/runtime-tests jsdom@26.1.0 --no-audit --no-fund
      - name: Menu, theme, filter and search behaviour
        run: node tests/runtime.cjs
      - name: Package the verified public files
        run: python tools/site.py package
      - uses: actions/upload-artifact@v4
        with:
          name: website-${{ matrix.os }}
          path: deploy/site-upload.zip
